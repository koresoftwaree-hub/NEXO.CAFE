<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rambla Cafe</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#E2E2E2">
    <link rel="apple-touch-icon" href="icon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Montserrat:wght@700;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="aurora-bg">
        <div class="aurora-blob"></div>
        <div class="aurora-blob"></div>
        <div class="aurora-blob"></div>
    </div>

    <div id="modalAlertaCustom" class="custom-modal-overlay">
        <div class="custom-modal-box">
            <div id="textoAlertaCustom" class="custom-modal-text">Mensaje de error</div>
            <button id="btnCerrarAlerta" class="btn-modal-ok">Entendido</button>
        </div>
    </div>

    <div class="main-container">
        
        <div id="pantallaSkeleton">
            <div class="wallet-card">
                <div class="card-header-skeleton">
                    <div>
                        <div class="skeleton-block" style="width: 80px; height: 32px; margin-bottom: 6px;"></div>
                        <div class="skeleton-block" style="width: 60px; height: 20px;"></div>
                    </div>
                    <div style="display: flex; flex-direction: column; align-items: flex-end;">
                        <div class="skeleton-block" style="width: 90px; height: 20px; margin-bottom: 6px;"></div>
                        <div class="skeleton-block" style="width: 70px; height: 14px;"></div>
                    </div>
                </div>
                <div class="stamps-skeleton">
                    <div class="stamps-grid">
                        <div class="skeleton-circle"></div><div class="skeleton-circle"></div><div class="skeleton-circle"></div><div class="skeleton-circle"></div>
                        <div class="skeleton-circle"></div><div class="skeleton-circle"></div><div class="skeleton-circle"></div><div class="skeleton-circle"></div>
                    </div>
                    <div class="skeleton-block" style="width: 80%; height: 14px; margin: 0 auto;"></div>
                </div>
                <div class="skeleton-block" style="width: 100%; height: 60px; margin-bottom: 28px;"></div>
                <div class="skeleton-block" style="width: 140px; height: 140px; margin: 0 auto; border-radius: 18px;"></div>
            </div>
        </div>

        <div id="pantallaIngreso" style="display: none; width: 100%; max-width: 400px; margin: 0 auto;">
            <div class="registro-card">
                <div class="logo-container" style="margin-bottom: 40px;">
                    <div class="logo-animado">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 170" width="180" height="90">
                            <text x="175" y="75" font-family="'Montserrat', sans-serif" font-weight="900" font-size="85" fill="var(--dark)" letter-spacing="-4px" text-anchor="middle">Rambla</text>
                            <text x="175" y="155" font-family="'Montserrat', sans-serif" font-weight="900" font-size="85" fill="var(--dark)" letter-spacing="2px" text-anchor="middle">Cafe</text>
                        </svg>
                    </div>
                </div>
                    
                <div class="input-group">
                    <label class="input-label">Tu nombre o apodo</label>
                    <input type="text" id="inputNombreIngreso" class="input-box" placeholder="Ej: Simon">
                </div>

                <div class="input-group">
                    <label class="input-label">WhatsApp (10 dígitos, sin 0 y sin 15)</label>
                    <input type="tel" id="inputCelularIngreso" class="input-box" placeholder="Ej: 2215551234" maxlength="10" required>
                </div>
                
                <button class="btn-primary" id="btnIngresar">Ingresar/Crear mi Tarjeta</button>

                <button id="btnInstalarApp" style="display: none; margin-top: 15px; width: 100%; background: transparent; border: 2px solid var(--dark); color: var(--dark); border-radius: 14px; font-weight: 700; padding: 14px; cursor: pointer; font-family: 'Inter', sans-serif;">Instalar app en tu celular</button>
            </div>
        </div>

        <div id="pantallaTarjeta">
            <p class="texto-girar">Toca la tarjeta para girarla</p>
            
            <div class="flip-container" onclick="this.classList.toggle('flipped')">
                <div class="flipper">
                    <div class="front">
                        <div class="wallet-card">
                            <div class="card-header">
                                <div style="display: flex; flex-direction: column;">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 170" width="110" height="55" style="margin-top: 2px;">
                                        <text x="0" y="75" font-family="'Montserrat', sans-serif" font-weight="900" font-size="85" fill="var(--dark)" letter-spacing="-4px">Rambla</text>
                                        <text x="0" y="155" font-family="'Montserrat', sans-serif" font-weight="900" font-size="85" fill="var(--dark)" letter-spacing="2px">Cafe</text>
                                    </svg>
                                </div>
                                <div class="user-info">
                                    <div class="user-nickname" id="displayNombre">...</div>
                                    <span class="user-tel-label" id="displayTelLabel">******0000</span>
                                </div>
                            </div>
                            
                            <div class="stamps-container">
                                <div class="stamps-grid" id="gridSellos"></div>
                                <p class="stamps-text">Sumá sellos y disfrutá tus beneficios</p>
                            </div>
                            
                            <div class="references-box">
                                <div class="ref-item">
                                    <div class="ref-icon-badge">
                                        <svg class="stamp-bolt" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                            <path class="bolt-main" d="m11.4251 14.3501 -6.80002 -0.8c-0.31667 -0.03335 -0.525 -0.20415 -0.625 -0.5125 -0.1 -0.30835 -0.033335 -0.57085 0.2 -0.7875l11.00002 -10.1c0.06665 -0.05 0.1375 -0.09167 0.2125 -0.125 0.075 -0.033335 0.1875 -0.05 0.3375 -0.05 0.25 0 0.44165 0.104165 0.575 0.3125 0.1333 0.20833 0.1333 0.42083 0 0.6375l-3.75 6.725 6.8 0.8c0.31665 0.03335 0.525 0.20415 0.625 0.5125 0.1 0.30835 0.0333 0.57085 -0.2 0.7875l-11 10.1c-0.0667 0.05 -0.1375 0.09165 -0.2125 0.125 -0.075 0.03335 -0.1875 0.05 -0.3375 0.05 -0.25 0 -0.4417 -0.10415 -0.575 -0.3125 -0.13335 -0.20835 -0.13335 -0.42085 0 -0.6375l3.75 -6.725Z"></path>
                                        </svg>
                                    </div>
                                    <span class="ref-text-legend">Sello 3: Fruta o Trufa proteica GRATIS</span>
                                    <span id="refStatus3" class="ref-text-status"></span>
                                </div>
                                <div class="ref-item">
                                    <div class="ref-icon-badge">
                                        <svg class="stamp-discount" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none" stroke-linecap="round" stroke-linejoin="round">
                                            <path class="discount-bg" d="M2 12a10 10 0 1 0 20 0 10 10 0 1 0 -20 0"></path>
                                            <path class="discount-symbol" d="m15 9 -6 6 M9 9h0.01 M15 15h0.01"></path>
                                        </svg>
                                    </div>
                                    <span class="ref-text-legend">Sello 5: 50%OFF EN AVOCADO TOAST</span>
                                    <span id="refStatus5" class="ref-text-status"></span>
                                </div>
                                <div class="ref-item">
                                    <div class="ref-icon-badge">
                                        <svg class="stamp-cup" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                                            <path class="steam-path" d="M38,30 V12 M50,32 V8 M62,30 V16" stroke-linecap="round"/>
                                            <path class="cup-path" d="M20,35 H80 V75 Q80,90 65,90 H35 Q20,90 20,75 Z" />
                                            <path class="cup-handle" d="M80,45 Q95,45 95,60 T80,75" />
                                        </svg>
                                    </div>
                                    <span class="ref-text-legend">Sello 8: Café GRATIS</span>
                                </div>
                            </div>
                            
                            <div class="info-row">
                                <div>
                                    <div class="info-label">Estado</div>
                                    <div class="info-value" id="displayPremio">...</div>
                                </div>
                                <div style="text-align: right;">
                                    <div class="info-label">Progreso</div>
                                    <div class="info-value info-value-points"><span id="displayPuntos">0</span>/8</div>
                                </div>
                            </div>
                            
                            <div class="qr-section">
                                <div class="qr-box"><img id="qrImage" src="" alt="QR Cliente"></div>
                                <div class="user-id">Tu codigo personal</div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="back">
                        <div class="back-logo-animado">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="300 250 400 450" width="280" height="280">
                                <path d="M619.78,336.36c3.99,14.01-12.83,29.04-19.37,31.38,29.29,6.7,63.58-6.17,63.64-34.4,0-21.58-21.61-31.74-22.38-48.68.55-11.06,8.46-19.18,13.04-28.68-28.92-3.39-65.7,20.58-53.56,52.27,4.78,11.79,16.42,15.42,18.63,28.11Z" fill="var(--verde-chill)"/>
                                <path d="M511.26,389.82c0,29.59,0,59.18-.01,88.76,0,12.77,10.35,23.13,23.13,23.13h42.13v-111.89c0-6.77-.61-16.01-3.24-26.62-11.41-47.33-55.81-84.35-107.35-83.97-43.25,0-86.5,0-129.75.01v310.1h65.25v-244.85c21.01,0,43.59-.01,64.5-.02,24.99,0,45.34,20.34,45.34,45.34Z" fill="var(--dark)"/>
                                <path d="M615.99,391.8c-5.71,0-11.49-.53-17.19-1.61v133.84h-64.49c-19.48.56-45.33-16.01-45.34-45.34,0,0,0-88.76,0-88.76,0-12.78-10.36-23.13-23.13-23.13h-42.12v111.9c0,61.08,49.51,110.59,110.59,110.59h129.75v-212.27c-12.87,9.62-30.17,14.8-48.06,14.8Z" fill="var(--dark)"/>
                            </svg>
                        </div>
                    </div>
                </div>
            </div>
            
            <button id="btnCerrarSesion" class="btn-cerrar">Cerrar sesión en este dispositivo</button>
        </div>
    </div>

    <div id="confettiContainer"></div>

    <script type="module" src="js/app.js"></script>
    
</body>
</html>
